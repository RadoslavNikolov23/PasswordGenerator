<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
        <style>

            body {
                font-family: Arial, Helvetica, sans-serif;
                background-color: darkgrey;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 90vh;
                margin: 5,10,5,10;
            }

            .container {
                text-align: center;
                padding: 40px;
                border: 2 px solid #050505;
                border-radius: 50px;
                background-color: lightgrey;
                width: 350px;
                box-shadow: 0 10px 10px rgb(0,0,0,0.1);
            }

            h1 {
                color: black;
            }

            label {
                font-size: 18px;    
            }

            input[type = "number"]{
                width: 90px;
                padding: 7px;
                margin:12px;
                border-radius: 6px;
                border: 1px solid #ddd;
            }

            button{
                padding: 10px 10px;
                background-color: darkseagreen;
                color: white;
                border: none;
                border-radius: 4px;
                cursor:pointer;
                font-size: 16px;
            }

            button:hover{
                background-color: lightblue;
            }

            .password-display input{
                margin-top: 10px;
                padding: 10px;
                width: 80%;
                font-size: 18px;
                border-radius: 4px;
                border: 1px solid #ddd;
                background-color: whitesmoke;
                text-align: center;
            }
            
            .main-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                height: auto;
                position: static;
                padding: 20px;
                gap: 20px;
            }

            .info-box {
                position: absolute;
                top: 20px;
                left: 20px;
                width: 230px;
                background-color: lightgrey;
                padding: 20px;
                border: 2px solid #ccc;
                border-radius: 10px;
                font-size: 14px;
                color: #333;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }

            .info-box h3 {
                margin-top: 0;
                font-size: 18px;
                color: #444;
            }

            .info-box ul {
                padding-left: 18px;
                list-style-type: disc;
            }

            .click-box {
                position: absolute;
                top: 200px;
                left: 20px;
                width: 230px;
                background-color: lightgrey;
                padding: 20px;
                border: 2px solid #ccc;
                border-radius: 10px;
                font-size: 14px;
                color: #333;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }
        
         @media (max-width: 600px) {
            body {
                padding: 10px;
                flex-direction: column;
                align-items: center; 
            }

            .container {
                width: 90vw;
                padding: 10px;
                font-size: 18px;
            }

            .info-box,
            .click-box {
                width: 80vw;
                font-size: 16px;
                padding: 10px;
                position: static;
                margin-top: 20px;
            }

            h1 {
                font-size: 24px;
            }

            label {
                font-size: 20px;
            }

            .password-display input {
                width: auto;
                font-size: 20px;
            }

            input[type="number"] {
                width: auto;
                font-size: 18px;
                padding: 10px;
            }

            button {
                font-size: 18px;
                padding: 12px;
                width: auto;
                margin-top: 10px;
            }
            #strengthBar {
                width: 100%;
                margin-left: 0;
            }
        }
        </style>
    </head>
    <body>
        <div class="info-box">
            <h3>ℹ️ Password Rules</h3>
            <ul>
                <li>Minimum: 8 characters</li>
                <li>Maximum: 32 characters</li>
                <li>Include letters, numbers, symbols</li>
                <li>Strong passwords are better 🔐</li>
            </ul>
        </div>
       
        <div class="click-box">
            <button id="copyClipboardButton" style="margin-top: 10px;">Copy password to clipboard</button>
        </div>

        <div class="main-wrapper">
         <div class = "container">
            <h1>Random Password Generator</h1>

            <div class ="generator-container">
                <label for="passwordLength">Password Lenght:</label>
                <input type="number" id ="passwordLength" value="12" min="8" max="32"/>
                
                <button id="generateButton">Generate Password</button>
                <button id="resetButton">Reset Password</button>
            </div>
            
            <div class="password-display">
                <input type="password" id="password" readonly/>
            </div>

            <div class="other-featers">
                <div id="strengthBar"  style="height: 10px; width: 84%; background-color: #b1b1b1; margin-top: 10px; margin-left: 30px;">
                    <div id="strengthLevel"style="height: 100%; width: 0%; background-color: red;"></div>
                </div>

                <label style="display: block; margin-top: 10px;">
                    <input type="checkbox" id="togglePassword" />
                    Show Password
                </label>           

                <p id="messageWarning" style="color:rgb(93, 3, 3); font-weight:bold;"></p>
                <p id="message" style="font-weight:bold;"></p>
            </div>
        </div>
   
        <script src="dist/task.js" defer></script>
    </body>
</html>
