<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="info-box">
            <h3>ℹ️ Password Rules</h3>
            <ul>
                <li>Minimum: 8 characters</li>
                <li>Maximum: 40 characters</li>
                <li>Include letters, numbers, symbols</li>
                <li>Strong passwords are better 🔐</li>
            </ul>
        </div>
       
        <div class="click-box">
            <button id="copyClipboardButton" style="margin-top: 10px;">Copy password to clipboard</button>
        </div>

        <div class="main-wrapper">
         <div class = "container">
            <h1>Random Password Generator</h1>

            <div class ="generator-container">
                <label for="passwordLength">Password Lenght:</label>
                <input type="number" id ="passwordLength" value="12" min="8" max="40"/>
                
                <button id="generateButton">Generate Password</button>
                <button id="resetButton">Reset Password</button>
            </div>
            
            <div class="password-display">
                <input type="password" id="password" readonly/>
            </div>

            <div class="other-featers">
                <div id="strengthBar"  style="height: 10px; width: 84%; background-color: #b1b1b1; margin-top: 10px; margin-left: 30px;">
                    <div id="strengthLevel"style="height: 100%; width: 0%; background-color: red;"></div>
                </div>

                <label style="display: block; margin-top: 10px;">
                    <input type="checkbox" id="togglePassword" />
                    Show Password
                </label>           

                <p id="messageWarning" style="color:rgb(93, 3, 3); font-weight:bold;"></p>
                <p id="message" style="font-weight:bold;"></p>
            </div>
        </div>
   
        <script src="dist/task.js" defer></script>
    </body>
</html>
